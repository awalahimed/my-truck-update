services:
  - type: web
    name: mytruck-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      # Database - Railway MySQL
      - key: MYSQL_HOST
        value: switchyard.proxy.rlwy.net
      - key: MYSQL_PORT
        value: 53151
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        value: HIlZmyLfFmqKDvIIqbgtWAQcOMwOdfik
      - key: MYSQL_DATABASE
        value: railway
      # Auth
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Features
      - key: LOGIN_ENABLED
        value: true
      - key: REGISTER_ENABLED
        value: true
      - key: FORGOT_PASSWORD_ENABLED
        value: true
      - key: OTP_ENABLED
        value: true
      - key: PHONE_OTP_REQUIRED
        value: true
      - key: OTP_CODE_LENGTH
        value: 6
      - key: OTP_TTL_SECONDS
        value: 300
      # File upload
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 50
      - key: CHUNK_SIZE
        value: 1048576
      - key: ALLOWED_MIME_TYPES
        value: image/*,application/pdf,video/*,audio/*
      # Rate limiting
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 15
      - key: RATE_LIMIT_MAX
        value: 100
      # JWT
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_ISSUER
        value: https://mytruck-backend.onrender.com
      - key: JWT_AUDIENCE
        value: my-track-mobile
      # Payment Gateway (Chapa) - Set these in Render dashboard
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_BASE_URL
        value: https://api.chapa.co/v1
      # SMS Gateway (AfroSMS) - Set these in Render dashboard
      - key: AFROSMS_API_KEY
        sync: false
      - key: AFROSMS_SENDER_ID
        value: MyTrack
      - key: AFROSMS_BASE_URL
        value: https://api.afrosms.com/api/send
      # CORS - Update with your frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      # Firebase - Set this in Render dashboard if using push notifications
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false